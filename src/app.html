<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<link rel="icon" href="%sveltekit.assets%/brand/ANT_symbol.svg" type="image/svg+xml" />
		<!-- Helvetica Neue via the supplied Adobe Fonts kit (exposes the family "helvetica-neue-lt-pro").
		     Font files are served by Adobe; nothing is bundled. System fallbacks are set in layout.css. -->
		<link rel="preconnect" href="https://use.typekit.net" crossorigin="anonymous" />
		<link rel="stylesheet" href="https://use.typekit.net/bwo2wyh.css" />
		<!-- Headline font: Adobe Fonts kit uct7pom (exposes the variable family "evert-pe-vf", weights 200–900). -->
		<link rel="stylesheet" href="https://use.typekit.net/uct7pom.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
