# Render Blueprint: ANT campaign website (static SvelteKit build, adapter-static).
projects:
  - name: ANT website
    environments:
      - name: production
        services:
          - name: ant-website
            type: web
            runtime: static
            buildCommand: npm ci && npm run build
            staticPublishPath: ./build
            envVars:
              - key: NODE_VERSION
                value: "24"
            routes:
              # Prerendered pages are emitted as <route>.html; serve them at clean URLs.
              - type: rewrite
                source: /resources
                destination: /resources.html
            headers:
              # Hashed build assets never change, so they can be cached forever.
              - path: /_app/immutable/*
                name: Cache-Control
                value: public, max-age=31536000, immutable
